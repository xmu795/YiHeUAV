slam_toolbox:
  ros__parameters:
    # 基本参数
    solver_plugin: solver_plugins::CeresSolver # 或者其他求解器
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # TF Frame 参数 (确保与你的 URDF 和 TF 树匹配)
    odom_frame: odom              # 里程计坐标系，由差速控制器发布
    map_frame: map                # 地图坐标系，由 slam_toolbox 发布
    base_frame: base_link         # 机器人基座坐标系
    scan_topic: /gazebo_ros_lidar/out # Lidar 数据主题
    imu_topic: /imu/data          # IMU 数据主题

    # 使用 IMU 数据 (重要!)
    use_imu_data: true

    # 地图参数
    resolution: 0.05              # 地图分辨率 (米/像素)
    max_laser_range: 6.0          # Lidar 最大有效距离 (应与 URDF 中配置匹配或略小)
    map_update_interval: 1.0      # 地图更新间隔 (秒)
    minimum_travel_distance: 0.2  # 触发地图更新的最小移动距离
    minimum_travel_heading: 0.1   # 触发地图更新的最小旋转角度 (弧度)

    # 匹配器参数 (可以根据效果调整)
    scan_matcher_type: CeresScanMatcher # 或 'ScanMatcher'
    max_scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    scan_queue_size: 10
    mode: mapping                 # 'mapping' 或 'localization'

    # 其他参数 (可以保持默认或根据需要调整)
    transform_publish_period: 0.02 # TF 发布周期 (s)
    map_publish_period: 2.0        # 地图发布周期 (s)
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_interval: 0.5
    throttle_scans: 1
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_fine: 0.8
    loop_match_minimum_response_coarse: 0.8
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    # ... 其他 slam_toolbox 参数