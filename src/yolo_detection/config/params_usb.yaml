      pixel_format: "mjpeg2rgb"
      av_device_format: "YUV422P"
      image_width: 1280
      image_height: 720
      camera_name: "usb_cam"
      # reusing same camera intrinsics only for demo, should really be unique for camera2"
      camera_info_url: ""
      brightness: -1
      contrast: -1
      saturation: -1
      sharpness: -1
      gain: -1
      auto_white_balance: true
      white_balance: 4000
      autoexposure: true
      exposure: 100
      autofocus: false
      focus: -1
